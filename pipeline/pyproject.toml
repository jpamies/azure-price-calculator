[project]
name = "azcalc-pipeline"
version = "0.1.0"
description = "Daily Azure Retail Prices export -> static JSON shards for the Azure price calculator SPA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
azcalc-pipeline = "azcalc_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azcalc_pipeline"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
