name: Build & Deploy (data + SPA)

# One workflow builds the daily price snapshot AND the SPA and publishes both as a single
# GitHub Pages artifact. Price data is never committed to git; each deploy replaces the site,
# so only the current snapshot is online. If the data pipeline fails (exporter release missing,
# header change, size limits), the job fails BEFORE deploy and the previous site stays online.

on:
  schedule:
    # The exporter (sbroenne/azureretailprices-exporter) publishes its daily release around
    # 06:00 UTC; 08:15 UTC leaves room for its run to finish. Adjust if it moves.
    - cron: "15 8 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exporter release tag to use (e.g. prices-2026-11-24). Empty = newest dated release."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Python tests (pipeline + icon sync, pytest)
        run: uv run --project pipeline pytest -q pipeline/tests scripts/test_sync_icons.py scripts/test_validation_cases.py

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund || { echo "::warning::npm ci failed; falling back to npm install"; npm install --no-audit --no-fund; }

      - name: Web unit tests
        working-directory: web
        run: uv run --project ../pipeline npm test

      - name: Web build with the synthetic sample data (smoke)
        run: |
          uv run --project pipeline azcalc-pipeline build --fixture --out web/public/data
          npm run build --prefix web

  build:
    name: Build price data + SPA
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Build price shards from the exporter release
        env:
          # Used only for api.github.com calls (higher rate limit); never sent to asset downloads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          args=(--out dist/data)
          if [ -n "${TAG}" ]; then args+=(--tag "${TAG}"); fi
          uv run --project pipeline azcalc-pipeline build "${args[@]}"

      - name: Validation cases (numbers to compare with the official calculator)
        run: python3 scripts/validation_cases.py dist/data

      - name: Sync official Azure Architecture Icons (best effort)
        run: |
          python3 scripts/sync_icons.py --dest web/public/icons/azure --if-missing \
            || echo "::warning::Icon sync failed; the app falls back to generic icons."

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build SPA
        working-directory: web
        run: |
          npm ci --no-audit --no-fund || { echo "::warning::npm ci failed; falling back to npm install"; npm install --no-audit --no-fund; }
          npm run build

      - name: Assemble Pages artifact
        run: |
          cp -r web/dist/. dist/
          # Hash routing makes deep links work without this, but keep a fallback for stray paths.
          cp web/dist/index.html dist/404.html
          echo "Artifact size: $(du -sh dist | cut -f1), files: $(find dist -type f | wc -l)"
          test -f dist/data/manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
